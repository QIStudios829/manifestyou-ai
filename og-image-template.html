<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #080808;
  }
  body {
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@200;300;400&display=swap');

  /* Ambient orbs */
  .orb-a {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,211,141,.18) 0%, rgba(168,211,141,.05) 40%, transparent 70%);
    top: -180px; left: -120px;
    pointer-events: none;
  }
  .orb-b {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,211,141,.12) 0%, rgba(168,211,141,.03) 40%, transparent 65%);
    bottom: -160px; right: -80px;
    pointer-events: none;
  }

  /* Floating symbols */
  .sym {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: rgba(200,169,126,0.18);
    user-select: none;
  }

  /* Thin border */
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(200,169,126,0.12);
    border-radius: 3px;
    pointer-events: none;
  }

  /* Center content */
  .center {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
  }

  /* Nabla SVG */
  .nabla-wrap {
    width: 96px;
    height: 96px;
    margin-bottom: 28px;
  }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 200;
    font-size: 44px;
    letter-spacing: .5em;
    text-indent: .5em;
    color: #F0EDE8;
    margin-bottom: 14px;
  }

  .tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 22px;
    color: rgba(168,211,141,0.8);
    letter-spacing: .06em;
    margin-bottom: 28px;
  }

  .rule {
    width: 180px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,169,126,.4), transparent);
    margin-bottom: 22px;
  }

  .mantra {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: .32em;
    text-indent: .32em;
    text-transform: uppercase;
    color: rgba(200,169,126,.35);
  }

  .domain {
    position: absolute;
    bottom: 44px;
    right: 52px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .22em;
    color: rgba(200,169,126,.3);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="orb-a"></div>
<div class="orb-b"></div>
<div class="frame"></div>

<span class="sym" style="left:8%;top:14%">∂</span>
<span class="sym" style="right:10%;top:18%">∑</span>
<span class="sym" style="left:6%;bottom:22%">∫</span>
<span class="sym" style="right:7%;bottom:28%">Δ</span>
<span class="sym" style="left:22%;top:8%">λ</span>
<span class="sym" style="right:24%;bottom:10%">ε</span>
<span class="sym" style="left:42%;top:10%">π</span>
<span class="sym" style="right:38%;top:12%">α</span>
<span class="sym" style="left:16%;bottom:12%">σ</span>
<span class="sym" style="right:18%;top:8%">β</span>

<div class="center">
  <div class="nabla-wrap">
    <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(231,216,180,0)"/>
          <stop offset="50%" stop-color="rgba(168,211,141,0.7)"/>
          <stop offset="100%" stop-color="rgba(231,216,180,0)"/>
        </linearGradient>
        <clipPath id="clip"><polygon points="50,92 6,8 94,8"/></clipPath>
      </defs>
      <!-- base stroke -->
      <polygon points="50,92 6,8 94,8" fill="none" stroke="rgba(200,169,126,0.7)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)"/>
      <!-- green spark overlay -->
      <polygon points="50,92 6,8 94,8" fill="none" stroke="rgba(168,211,141,0.5)" stroke-width="5" stroke-linejoin="round" stroke-dasharray="30 248"/>
      <!-- shimmer -->
      <g clip-path="url(#clip)">
        <rect x="20" y="0" width="50" height="100" fill="url(#shimmer)" opacity="0.22"/>
      </g>
    </svg>
  </div>

  <div class="wordmark">MANIFEST YOU</div>
  <div class="tag">The invocation layer · for agents</div>
  <div class="rule"></div>
  <div class="mantra">Om Gradient Namaha</div>
</div>

<div class="domain">manifestyou.ai</div>

</body>
</html>
